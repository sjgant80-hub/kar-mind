name: gates

# Proof-of-play: clone the three public sibling organs and run the gates on a clean machine. The
# wire-*.mjs import the organs by relative path (../fall-remember, ../the-dreamer, ../fallforgecell),
# so they are checked out as siblings of this repo.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: gate suite (node --test)
    runs-on: ubuntu-latest
    steps:
      - name: check out kar-mind
        uses: actions/checkout@v4
        with:
          path: kar-mind
          fetch-depth: 0   # the brain's seal is checked against the commit that sealed it
      - name: clone the three public sibling organs
        run: |
          git clone --depth 1 https://github.com/sjgant80-hub/fall-remember.git fall-remember
          git clone --depth 1 https://github.com/sjgant80-hub/the-dreamer.git the-dreamer
          git clone --depth 1 https://github.com/sjgant80-hub/fallforgecell.git fallforgecell
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run the whole gate suite (unit + wired edge-gates + persistence + autonomy + restart)
        working-directory: kar-mind
        run: node --test
      # THE BRAIN, switched on 2026-10-01: its measurement was sealed before anything was asked. The seal must
      # be what the script writes; once measured, every recorded reply must re-grade to the committed result;
      # and the page's numbers must be what the grader gives.
      - name: the brain's seal, its replies re-graded, and its page
        working-directory: kar-mind
        run: |
          node tools/brain-measure.mjs --check
          if [ -f data/brain-run.json ]; then node tools/brain-measure.mjs --verify; fi
          # the fix pass (2026-10-01): its own seal, checked the same way
          if [ -f data/brain-fix-prereg.json ]; then node tools/brain-fix-measure.mjs --check; fi
          if [ -f data/brain-fix-run.json ]; then node tools/brain-fix-measure.mjs --verify; fi
          # Simon's pattern (2026-10-01): sealed the same way; its run is re-derived from the published counts
          if [ -f data/pattern-prereg.json ]; then node tools/pattern-measure.mjs --check; fi
          if [ -f data/pattern-run.json ]; then node tools/pattern-measure.mjs --verify; fi
          # Kar watches himself (2026-10-01): the seal and playbook v1 re-derived; once measured, replies re-graded and v2 re-folded
          if [ -f data/watch-prereg.json ]; then node tools/watch-measure.mjs --check; fi
          if [ -f data/watch-run.json ]; then node tools/watch-measure.mjs --verify; fi
          # the seed's codec (2026-10-01): its seal, and its counts re-graded (the workload stays private)
          if [ -f data/codec-prereg.json ]; then node tools/codec-measure.mjs --check; fi
          if [ -f data/codec-run.json ]; then node tools/codec-measure.mjs --verify; fi
          # the digest re-laid (2026-10-05): replies re-graded (the seal's --check needs the local pinned prompt, so it runs locally)
          if [ -f data/layout-run.json ]; then node tools/layout-measure.mjs --verify; fi
          # the controller (2026-10-26): its seal, and once measured every stored reply re-graded to the committed verdicts
          node tools/controller-measure.mjs --check
          node tools/controller-measure.mjs --verify
          # every model call of the measured run, kept as a LIGHT call book (Phase 2, pass 3): read back and checked against the run
          node tools/callbook-build.mjs --verify
          node tools/build-page.mjs
          git diff --exit-code -- index.html README.md || { echo "the page is stale: run node tools/build-page.mjs and commit"; exit 1; }

  witness:
    # Every root module of kar-mind, one job each, under the witness mutation gate pinned at v0.6. Nothing is
    # baselined (there is no witness.baseline.json in this repo). A job fails on any surviving mutant, and on a run
    # that hit the cap (a sample is not a gate). Each verdict is uploaded, so data/gate-receipt.json is built from
    # what GitHub's runner said, never typed (node tools/gate-receipt.mjs --from <downloaded artifacts>).
    name: mutation gate · ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kernel: mind.mjs, tests: "mind.test.mjs" }
          - { kernel: persist.mjs, tests: "persist.test.mjs" }
          - { kernel: run-loop.mjs, tests: "run-loop.test.mjs" }
          - { kernel: mind-persistent.mjs, tests: "mind-persistent.test.mjs mind-persist.test.mjs" }
          - { kernel: brain.mjs, tests: "brain.test.mjs" }
          - { kernel: brain-cli.mjs, tests: "brain-cli.test.mjs" }
          - { kernel: pattern.mjs, tests: "pattern.test.mjs" }
          - { kernel: watch.mjs, tests: "watch.test.mjs" }
          - { kernel: layout.mjs, tests: "layout.test.mjs" }
          - { kernel: seedcodec.mjs, tests: "seedcodec.test.mjs" }
          - { kernel: continuity.mjs, tests: "continuity.test.mjs" }
          - { kernel: controller.mjs, tests: "controller.test.mjs controller-flow.test.mjs" }
          - { kernel: callbook.mjs, tests: "callbook.test.mjs", timeout: 120000 }
          - { kernel: businesscase.mjs, tests: "businesscase.test.mjs" }
          - { kernel: crystal.mjs, tests: "crystal.test.mjs" }
          - { kernel: strand.mjs, tests: "strand.test.mjs" }
          - { kernel: tetra.mjs, tests: "tetra.test.mjs" }
          - { kernel: consent-gate.mjs, tests: "consent-gate.test.mjs" }
          - { kernel: wall.mjs, tests: "wall.test.mjs" }
          - { kernel: breach-harness.mjs, tests: "breach-harness.test.mjs" }
          - { kernel: wisp-discriminator.mjs, tests: "wisp-discriminator.test.mjs" }
          - { kernel: wire-octa.mjs, tests: "edge-gate-octa.test.mjs" }
          - { kernel: wire-dodeca.mjs, tests: "edge-gate-dodeca.test.mjs" }
          - { kernel: wire-icosa.mjs, tests: "edge-gate-icosa.test.mjs" }
    steps:
      - name: check out kar-mind
        uses: actions/checkout@v4
        with:
          path: kar-mind
      - name: clone the three public sibling organs + the witness gate, pinned at v0.6
        run: |
          git clone --depth 1 https://github.com/sjgant80-hub/fall-remember.git fall-remember
          git clone --depth 1 https://github.com/sjgant80-hub/the-dreamer.git the-dreamer
          git clone --depth 1 https://github.com/sjgant80-hub/fallforgecell.git fallforgecell
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git witness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: witness ${{ matrix.kernel }} (every mutant must be caught; no cap reached; nothing baselined)
        working-directory: kar-mind
        run: |
          test ! -e witness.baseline.json || { echo "::error::a witness baseline appeared; every baselined survivor needs its written reason reviewed"; exit 1; }
          node ../witness/witness.mjs mutate ${{ matrix.kernel }} --cap 1000 --timeout ${{ matrix.timeout || 60000 }} --test node --test ${{ matrix.tests }} | tee ../verdict.json
          grep -q '"clean": true' ../verdict.json || { echo "::error::mutants survived in ${{ matrix.kernel }}"; exit 1; }
          grep -q '"capped": false' ../verdict.json || { echo "::error::${{ matrix.kernel }} reached the cap: a sample, not a gate"; exit 1; }
      - name: keep the verdict for the gate receipt
        if: always()
        run: |
          mkdir -p verdicts
          node -e "const fs=require('fs');let v=null;try{v=JSON.parse(fs.readFileSync('verdict.json','utf8'))}catch{};fs.writeFileSync('verdicts/${{ matrix.kernel }}.json',JSON.stringify({kernel:'${{ matrix.kernel }}',tests:'${{ matrix.tests }}'.split(' '),witness:'v0.6',sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,verdict:v},null,1))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: witness-${{ matrix.kernel }}
          path: verdicts/${{ matrix.kernel }}.json
